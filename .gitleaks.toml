# gitleaks 設定（機密情報の履歴検査）
#
# 役割:
#   このファイルは gitleaks の誤検知を除外する唯一の場所（要件3.4）。
#   除外は必ずここに書き、ワークフロー側の引数やコミットメッセージで回避しない。
#
# 実行場所:
#   **CI のみ。** GitHub Actions の gitleaks Action で実行する（design.md 3章）。
#   ローカルには導入しない（バイナリ配布であり npm で完結しないため）。
#   ローカルのコミット前検査は secretlint（`.secretlintrc.json`）が担当する。
#   両者は用途が違う。secretlint = 作業ツリー / gitleaks = コミット履歴。
#
# 検査対象:
#   履歴全体。CI の checkout は `fetch-depth: 0` にする必要がある。

[extend]
# gitleaks 同梱の既定ルールセットをそのまま使う。
# 自前でルールを書くとアップストリームの改善を取り込めなくなるため、
# ルールは追加せず、除外のみをこのファイルで管理する。
useDefault = true

# ---------------------------------------------------------------------------
# 誤検知の除外（現時点では1件もない）
#
# 検出が出た場合、**まず本物の機密情報でないことを確認する。**
# 本物だった場合は除外ではなく、認証情報の失効と履歴からの削除で対処する。
# 誤検知と判断した場合のみ、下記の形で最小範囲の除外を追加する。
# 除外には必ず description で理由を残す。
#
# [allowlist]
#   description = "なぜ除外して安全なのかを書く"
#   paths = ['''^docs/example-config\.md$''']   # ファイル単位
#   regexes = ['''AKIA[A-Z0-9]{16}''']          # 文字列単位（AWS 公式のサンプル値など）
#   commits = ["<commit sha>"]                  # コミット単位（最後の手段）
#
# paths / regexes は正規表現。広すぎる除外は検査を無効化するのと同じなので、
# ディレクトリ全体やルール全体を除外しない。
# ---------------------------------------------------------------------------
